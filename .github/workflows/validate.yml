name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Validate marketplace and plugins
        run: |
          npx -y @anthropic-ai/claude-code plugin validate .
          for plugin in plugins/*/; do
            npx -y @anthropic-ai/claude-code plugin validate "$plugin"
          done
